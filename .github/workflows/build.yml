name: Build RP2040 Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 获取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 下载 Pico SDK
      - name: Download Pico SDK
        run: |
          git clone --depth 1 https://github.com/raspberrypi/pico-sdk.git
          cd pico-sdk
          git submodule update --init --depth 1

      # 3. 准备 SDK 导入文件
      - name: Prepare Pico SDK
        run: |
          cp pico-sdk/external/pico_sdk_import.cmake .

      # 4. 配置 CMake
      - name: Configure
        run: |
          cmake -S . -B build \
            -DPICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk \
            -DCMAKE_BUILD_TYPE=Release

      # 5. 编译
      - name: Build
        run: |
          cmake --build build --parallel 4 --verbose

      # 6. 显示生成的文件
      - name: List build files
        run: |
          echo "===== Build output ====="
          find build -maxdepth 2 -type f \
            \( -name "*.uf2" -o -name "*.bin" -o -name "*.hex" -o -name "*.elf" \) \
            -print

      # 7. 上传文件
      - name: Upload firmware files
        uses: actions/upload-artifact@v4
        with:
          name: stm_programmer-all
          path: |
            build/*.uf2
            build/*.bin
            build/*.hex
            build/*.elf
          if-no-files-found: warn
