name: Build RP2040 Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 获取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 设置缓存
      - name: Set up cache
        uses: actions/cache@v3
        with:
          path: |
            ~/pico-sdk
            ~/.cache/pico-sdk
            build
          key: ${{ runner.os }}-pico-sdk-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-pico-sdk-
            ${{ runner.os }}-

      # 3. 安装编译工具（只在缓存未命中时执行）
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt update
          sudo apt install -y \
            cmake \
            ninja-build \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            build-essential \
            git \
            python3-pip \
            python3-setuptools

      # 4. 下载 Pico SDK（只在缓存未命中时执行）
      - name: Download Pico SDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/raspberrypi/pico-sdk.git ~/pico-sdk
          cd ~/pico-sdk
          git submodule update --init --depth 1

      # 5. 准备 Pico SDK 导入文件
      - name: Prepare Pico SDK
        run: |
          cp ~/pico-sdk/external/pico_sdk_import.cmake .

      # 6. 配置 CMake
      - name: Configure
        run: |
          cmake -S . -B build \
            -DPICO_SDK_PATH=~/pico-sdk \
            -DCMAKE_BUILD_TYPE=Release \
            -G "Unix Makefiles"

      # 7. 编译
      - name: Build
        run: |
          cmake --build build --parallel 4 --verbose

      # 8. 显示生成的文件
      - name: List build files
        run: |
          echo "===== Build output ====="
          find build -maxdepth 2 -type f \
            \( -name "*.uf2" -o -name "*.bin" -o -name "*.hex" -o -name "*.elf" \) \
            -print

      # 9. 上传文件
      - name: Upload firmware files
        uses: actions/upload-artifact@v4
        with:
          name: stm_programmer-all
          path: |
            build/*.uf2
            build/*.bin
            build/*.hex
            build/*.elf
          if-no-files-found: warn
