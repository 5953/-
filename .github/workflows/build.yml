name: Build RP2040 Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 获取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 删除旧的 SDK（如果存在）
      - name: Clean old SDK
        run: |
          if [ -d "pico-sdk" ]; then
            echo "删除旧的 SDK..."
            rm -rf pico-sdk
          fi

      # 3. 重新下载 Pico SDK
      - name: Download Pico SDK
        run: |
          echo "下载 Pico SDK..."
          git clone --depth 1 https://github.com/raspberrypi/pico-sdk.git
          cd pico-sdk
          echo "初始化子模块..."
          git submodule update --init --depth 1

      # 4. 准备 Pico SDK 导入文件
      - name: Prepare Pico SDK
        run: |
          echo "准备 SDK 导入文件..."
          cp pico-sdk/external/pico_sdk_import.cmake .

      # 5. 配置 CMake
      - name: Configure
        run: |
          echo "配置 CMake..."
          cmake -S . -B build \
            -DPICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk \
            -DCMAKE_BUILD_TYPE=Release \
            -G "Unix Makefiles"

      # 6. 编译
      - name: Build
        run: |
          echo "开始编译..."
          cmake --build build --parallel 4 --verbose

      # 7. 显示生成的文件
      - name: List build files
        run: |
          echo "===== 构建输出 ====="
          find build -maxdepth 2 -type f \
            \( -name "*.uf2" -o -name "*.bin" -o -name "*.hex" -o -name "*.elf" \) \
            -print

      # 8. 上传文件
      - name: Upload firmware files
        uses: actions/upload-artifact@v4
        with:
          name: stm_programmer-all
          path: |
            build/*.uf2
            build/*.bin
            build/*.hex
            build/*.elf
          if-no-files-found: warn
